<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <div class="rm-shell">
        <div class="rm-page-head">
            <div class="rm-page-head__icon" aria-hidden="true"></div>
            <div>
                <h1>{title}</h1>
                <p>{introText}</p>
            </div>
        </div>
        <div class="rm-toolbar">
            <f:for each="{tabs}" as="tab">
                <f:if condition="{tab.id} == {activeTab.id}">
                    <f:then>
                        <a href="{tab.route}" class="btn btn-primary" data-tab-id="{tab.id}">{tab.label}</a>
                    </f:then>
                    <f:else>
                        <a href="{tab.route}" class="btn btn-default" data-tab-id="{tab.id}">{tab.label}</a>
                    </f:else>
                </f:if>
            </f:for>
        </div>
        <div class="rm-note">
            <strong>{activeTab.label}</strong>
            <br>
            {activeTab.description}
        </div>
        <div class="rm-card">
            <div class="rm-card__head"><strong><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:tabs.history.label" /></strong></div>
            <div class="rm-card__body">
                <p class="rm-muted">{data.historyNotice}</p>
                <f:if condition="{data.canSeeHistory}">
                    <f:then>
                        <f:if condition="{data.historyTableReady}">
                            <f:then>
                                <f:if condition="{data.historyRows}">
                                    <f:then>
                                        <div class="rm-table-wrap">
                                            <table class="rm-table">
                                                <thead>
                                                    <tr>
                                                        <th><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:common.time" /></th>
                                                        <th><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:common.backendUser" /></th>
                                                        <f:if condition="{data.showImpersonationColumn}">
                                                            <th><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:common.switchedFrom" /></th>
                                                        </f:if>
                                                        <th><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:common.section" /></th>
                                                        <th><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:common.action" /></th>
                                                        <th><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:common.summary" /></th>
                                                        <th><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:common.status" /></th>
                                                        <th><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:common.actions" /></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <f:for each="{data.historyRows}" as="row">
                                                        <tr>
                                                            <td>{row.formattedTime}</td>
                                                            <td>{row.backend_user_name}</td>
                                                            <f:if condition="{data.showImpersonationColumn}">
                                                                <td>{row.impersonated_user_name}</td>
                                                            </f:if>
                                                            <td>{row.scope}</td>
                                                            <td>{row.action}</td>
                                                            <td>{row.summary}</td>
                                                            <td>{row.revertStatusLabel}</td>
                                                            <td>
                                                                <f:if condition="{row.isUndoable}">
                                                                    <form method="post" action="{routeUrls.historyUndo}" class="rm-history-undo">
                                                                        <input type="hidden" name="form_token" value="{historyUndoFormToken}">
                                                                        <input type="hidden" name="history_uid" value="{row.uid}">
                                                                        <input type="hidden" name="returnUrl" value="{routeUrls.history}">
                                                                        <button type="submit" class="btn btn-default btn-sm"><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:history.undo" /></button>
                                                                    </form>
                                                                </f:if>
                                                            </td>
                                                        </tr>
                                                    </f:for>
                                                </tbody>
                                            </table>
                                        </div>
                                    </f:then>
                                    <f:else>
                                        <div class="rm-empty"><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:history.empty" /></div>
                                    </f:else>
                                </f:if>
                            </f:then>
                            <f:else>
                                <div class="rm-empty"><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:history.tableMissing" /></div>
                            </f:else>
                        </f:if>
                    </f:then>
                    <f:else>
                        <div class="rm-empty"><f:translate key="LLL:EXT:ppl_rights_management/Resources/Private/Language/locallang.xlf:history.adminOnly" /></div>
                    </f:else>
                </f:if>
            </div>
        </div>
    </div>
</html>
